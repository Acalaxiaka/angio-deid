name: build-windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
env:
  PYTHONIOENCODING: utf-8
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", architecture: x64 }
      - run: pip install -r requirements.txt
      - run: python selftest.py
      - run: pyinstaller --noconfirm --onefile --windowed --name angio-deid --collect-all tkinterdnd2 --collect-all pylibjpeg --collect-all libjpeg --collect-all openjpeg --collect-all rle --collect-all gdcm --collect-binaries imageio_ffmpeg --collect-submodules pydicom --hidden-import selftest app.py
      - uses: actions/upload-artifact@v4
        with: { name: angio-deid-exe, path: dist/angio-deid.exe }
  test:
    needs: build
    strategy:
      matrix: { os: [windows-2022, windows-2025] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: angio-deid-exe }
      - shell: pwsh
        run: |
          $p = Start-Process -FilePath .\angio-deid.exe -ArgumentList '--selftest', "$PWD\report.txt" -Wait -PassThru
          Get-Content report.txt -Encoding utf8
          if ($p.ExitCode -ne 0) { exit 1 }
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: angio-deid-exe }
      - uses: softprops/action-gh-release@v2
        with: { files: angio-deid.exe }
